# Keycloak e PostgreSQL num cluster de DEV, no namespace keycloak. O lab no k3d
# continua com scripts/keycloak/keycloak.sh. Os Secrets ficam fora do git e
# precisam existir antes do apply. Passe sempre o --context: sem ele, o kubectl
# usa o contexto atual.
#
#   CTX=<contexto do DEV>
#   kubectl --context "$CTX" apply -f scripts/keycloak/dev/namespace.yaml
#   kubectl --context "$CTX" -n keycloak create secret generic keycloak-postgres \
#       --from-literal=username=keycloak --from-literal=password="$(openssl rand -hex 24)"
#   kubectl --context "$CTX" -n keycloak create secret generic keycloak-admin \
#       --from-literal=password="$(openssl rand -hex 16)"
#   kubectl --context "$CTX" apply -k scripts/keycloak/dev
#   kubectl --context "$CTX" -n keycloak rollout status deployment/keycloak --timeout=10m
#
# Console: kubectl --context "$CTX" -n keycloak port-forward svc/keycloak 18080:8080
# (a 8080 da máquina é do k3d do lab), depois http://localhost:18080/auth/admin com
# admin e a senha de
#   kubectl --context "$CTX" -n keycloak get secret keycloak-admin -o jsonpath='{.data.password}' | base64 -d
#
# kubectl --context "$CTX" delete -k scripts/keycloak/dev apaga o namespace, e com
# ele o volume do banco e os Secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - keycloak.yaml
