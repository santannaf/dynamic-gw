plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.graalvm.buildtools.native'
}

ext {
    set('springBootVersion', '4.1.2')
    set('springCloudVersion', '2025.1.4')
    set('fabric8Version', '8.0.0')
    // A Fabric8 8.0.0 traz o Vert.x 5.2.0 (CVE-2026-102476, CVE-2026-102479 e CVE-2026-102467
    // no vertx-core, CVE-2026-118489 no vertx-web-client). Tire o override quando uma
    // versão da Fabric8 trouxer o Vert.x 5.2.3 ou mais novo.
    set('vertxVersion', '5.2.3')
    // Fabric8 8 é feito sobre Jackson 3.2 (anotações 2.22) e o Boot 4.1.2 ainda
    // gerencia 3.1.x/2.21: sobrescreve os dois BOMs até um Boot que traga 3.2.
    // O BOM do Jackson 2 entra porque é ele que fixa a versão de jackson-annotations.
    set('jackson-bom.version', '3.2.4')
    set('jackson-2-bom.version', '2.22.4')
    // O Spring Cloud 2025.1.4 fixa o Bouncy Castle em 1.85.2 e rebaixa o 1.86 que a Fabric8
    // pede; as CVEs dele (CVE-2026-17508, CVE-2026-71888, CVE-2026-71889, CVE-2026-71892,
    // entre outras) só fecham na 1.86. Tire quando o Spring Cloud gerenciar 1.86 ou mais novo.
    set('bouncycastle.version', '1.86')
    set('awsSdkVersion', '2.57.4')
    set('mockitoVersion', '5.24.0')
}

dependencies {
    implementation project(':shared')

    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "io.fabric8:kubernetes-client:${fabric8Version}"

    // SSO/auditoria (gateway.security.*): OIDC com Keycloak, bearer JWT e
    // JWE do cookie de sessão (Nimbus, que vem com o oauth2-jose); LDAP direto
    // via UnboundID (sem JNDI; o servidor em memória dele roda nos testes).
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'com.unboundid:unboundid-ldapsdk'

    // S3 backend (default credential chain reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation "io.fabric8:kubernetes-server-mock:${fabric8Version}"
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    aotTestCompileOnly 'org.apiguardian:apiguardian-api:1.1.2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "io.fabric8:kubernetes-client-bom:${fabric8Version}"
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
    }
    // Módulo a módulo, e não pelo BOM do Vert.x: ele também gerencia Netty e Jackson,
    // que ficam com o Boot.
    dependencies {
        dependencySet(group: 'io.vertx', version: vertxVersion) {
            entry 'vertx-core'
            entry 'vertx-core-logging'
            entry 'vertx-web-client'
            entry 'vertx-web-common'
            entry 'vertx-auth-common'
            entry 'vertx-uri-template'
            entry 'vertx-web'
            entry 'vertx-bridge-common'
            entry 'vertx-eventbus-bridge-common'
        }
    }
}

List<String> quietMockJvmArgs = [
        '-Dnet.bytebuddy.safe=true',
        '-XX:+EnableDynamicAgentLoading'
]

tasks.named('test', Test).configure { Test t ->
    t.jvmArgs(quietMockJvmArgs)
}

tasks.named('processTestAot', JavaExec).configure { JavaExec t ->
    t.jvmArgs(quietMockJvmArgs)
}

graalvmNative {
    binaries {
        main {
            imageName = 'dynamic-gateway'
            mainClass = 'com.example.gateway.GatewayApplication'
            buildArgs.addAll(
                    '--no-fallback',
                    '--enable-url-protocols=http,https',
                    '--enable-native-access=ALL-UNNAMED',
                    // Netty 4.2.19+ no Java 25 libera buffers diretos fechando um Arena.ofShared()
                    // (CleanerJava25); sem isto o binário derruba a conexão com UnsupportedFeatureError.
                    '-H:+SharedArenaSupport',
                    '-H:+AddAllCharsets',                  // snakeyaml-engine (via Fabric8) precisa de UTF-32BE etc.
                    '-H:+ReportExceptionStackTraces'
            )
        }
    }
}