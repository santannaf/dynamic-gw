spring:
  application:
    name: dynamic-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            pool:
              # NAT e firewall no caminho até um backend externo derrubam conexão parada sem
              # avisar; reaproveitada, ela deixava a requisição pendurada até o nginx-lb dar 504.
              # Ociosa por mais de 20s, a conexão é fechada em vez de voltar ao uso.
              max-idle-time: 20s
              eviction-interval: 10s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder: ERROR
    io.micrometer.core.instrument.binder.jvm.JvmGcMetrics: ERROR

gateway:
  routes:
    store:
      type: configmap
      configmap:
        namespace: platform
        config-map-name: gateway-routes
        key: routes.yaml
      s3:
        bucket: ""
        key: ""
        region: us-east-1
