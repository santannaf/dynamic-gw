# Cenário 2: o gateway usa o Keycloak com LDAP. Store: properties (v1).
#
# Profiles: standalone-sso,keycloak. O login é com usuário e senha na tela do
# Keycloak, que valida a senha no AD pela federação LDAP do realm. Sem Identity
# Provider no realm não há OBO.
#
# A aud por rota sai da troca V2 do Keycloak 26.2 ou mais novo (o lab usa o
# 26.8.2): o realm precisa do client abc-api e de um client scope opcional de
# mesmo nome, que o gateway pede na troca.

gateway:
  security:
    enabled: true
    default-access: authenticated
  routes:
    store:
      type: properties
      properties:
        version: "cenario-2-keycloak-ldap"
        routes:
          # PUBLIC: sem login. O gateway tira os headers X-Auth-Request-* e os cookies dele.
          - id: public-api
            path: /public/**
            target-uri: http://public-api.platform.svc.cluster.local:8080
            strip-prefix: 1
            team: platform-team
            description: Rota pública.
            access:
              mode: public
            rate-limit:                     # 20 a cada 10s por endereço, em cada réplica
              requests: 20
              period: 10s
              key: ip

          # LDAP pelo Keycloak: login no Keycloak, que valida a senha no AD.
          - id: abc
            path: /abc/**
            target-uri: http://abc-api.platform.svc.cluster.local:8080
            strip-prefix: 1
            team: abc-team
            description: Usuários com a role abc-user.
            access:
              any-of:
                - role:abc-user
              forward-token: true           # o backend recebe um token
              audience: abc-api             # troca V2: aud=abc-api (client no realm)
            rate-limit:                     # 10 a cada 10s por usuário, em cada réplica
              requests: 10
              period: 10s
              key: user
            throttle:                       # até 5 ao mesmo tempo; mais 10 esperam até 2s
              max-concurrent: 5
              max-queue: 10
              max-wait: 2s
