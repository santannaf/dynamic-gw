# Schema de spec.access no CRD (k8s/crd/gatewayroutes.platform.saca.pags.yaml), copiado de lá.
# mode, anyOf, forwardToken e a primeira regra existiam antes; o que está marcado "novo" veio com a
# ETT-1452. Fragmento: fica em spec.versions[].schema.openAPIV3Schema.properties.spec.properties.
access:
  type: object
  description: Access policy enforced by the gateway. Absent means the gateway's default access (gateway.security.default-access).
  properties:
    mode:
      type: string
      enum:
        - public
        - authenticated
      description: public allows anonymous callers; authenticated requires a session or a bearer token. Absent with anyOf means authenticated.
    anyOf:
      type: array
      maxItems: 32
      description: The caller needs at least one of these authorities, written <type>:<name>. Each gateway defines its types (group:<name>, role:<name>, scope:<name>, ...); a type the gateway does not produce authorizes nobody.
      items:
        type: string
        maxLength: 256
        pattern: '^[a-z][a-z0-9-]*:.+$'
    forwardToken:
      type: boolean
      description: When true the gateway sends a token upstream as Authorization Bearer, the caller's access token unless audience or obo picks another one.
    channel:                         # novo
      type: string
      enum:            # canais que o gateway sabe rodar juntos (gateway.security.additional-providers)
        - keycloak
        - ldap
      description: Identity channel whose session the route accepts. Absent means the gateway's provider.
    identityProvider:                # novo
      type: string
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]+$'
      description: Alias of the Keycloak identity provider the session must come from, such as microsoft. A session from another login is sent to log in again.
    audience:                        # novo
      type: string
      minLength: 1
      maxLength: 255
      description: Keycloak client the forwarded token is issued for, by token exchange; the backend validates this aud. Needs forwardToken.
    obo:                             # novo
      type: object
      description: Entra On-Behalf-Of. The backend receives the Entra token for these scopes instead of the caller's token. Needs forwardToken and identityProvider.
      required:
        - scopes
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: '^\S+$'   # vão separados por espaço no pedido ao Entra
  x-kubernetes-validations:
    - rule: "!(has(self.mode) && self.mode == 'public' && has(self.anyOf) && size(self.anyOf) > 0)"
      message: access.mode=public cannot be combined with a non-empty access.anyOf
    - rule: "!(has(self.mode) && self.mode == 'public') || (!(has(self.forwardToken) && self.forwardToken) && !has(self.channel) && !has(self.identityProvider) && !has(self.audience) && !has(self.obo))"
      message: access.mode=public accepts no other access field
    - rule: "!(has(self.channel) && self.channel == 'ldap') || (!(has(self.forwardToken) && self.forwardToken) && !has(self.identityProvider) && !has(self.audience) && !has(self.obo))"
      message: access.channel=ldap has no token, so it accepts no forwardToken, identityProvider, audience or obo
    - rule: "!(has(self.audience) || has(self.obo)) || (has(self.forwardToken) && self.forwardToken)"
      message: access.audience and access.obo pick the token the backend receives, so they need access.forwardToken true
    - rule: "!(has(self.audience) && has(self.obo))"
      message: access.audience and access.obo cannot be combined
    - rule: "!has(self.obo) || has(self.identityProvider)"
      message: access.obo needs access.identityProvider (the exchange uses the token stored at that login)

# Em spec.x-kubernetes-validations, porque olha o access e o aggregate da rota:
#
#   - rule: "!(has(self.aggregate) && has(self.access) && (has(self.access.audience) || has(self.access.obo)))"
#     message: access.audience and access.obo cannot be combined with aggregate (the same token would reach every backend)
