# Schema proposto de spec.access no CRD (k8s/crd/gatewayroutes.platform.saca.pags.yaml).
# É um fragmento: vai em spec.versions[].schema.openAPIV3Schema.properties.spec.properties
# e não se aplica sozinho. mode, anyOf, forwardToken e a primeira regra são os de
# hoje; o que está marcado "novo" é a proposta.
access:
  type: object
  description: Access policy enforced by the gateway. Absent means the gateway's default access (gateway.security.default-access).
  properties:
    mode:
      type: string
      enum:
        - public
        - authenticated
      description: public allows anonymous callers; authenticated requires a session or a bearer token. Absent with anyOf means authenticated.
    anyOf:
      type: array
      maxItems: 32
      description: The caller needs at least one of these authorities, written <type>:<name>. Each gateway defines its types (group:<name>, role:<name>, scope:<name>, ...); a type the gateway does not produce authorizes nobody.
      items:
        type: string
        maxLength: 256
        pattern: '^[a-z][a-z0-9-]*:.+$'
    forwardToken:
      type: boolean
      description: When true the gateway sends a token upstream as Authorization Bearer, the caller's access token unless audience or obo picks another one.
    channel:                         # novo
      type: string
      enum:
        - keycloak
        - ldap
      description: Identity channel whose session the route accepts. Absent means the gateway's provider.
    identityProvider:                # novo
      type: string
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]+$'
      description: Alias of the Keycloak identity provider the session must come from, such as microsoft.
    audience:                        # novo
      type: string
      maxLength: 255
      description: Keycloak client the forwarded token is issued for, by token exchange. The backend validates this aud. Needs forwardToken.
    obo:                             # novo
      type: object
      description: Entra On-Behalf-Of. The backend receives the Entra token for these scopes instead of the caller's token. Needs forwardToken and identityProvider.
      required:
        - scopes
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            maxLength: 256
  x-kubernetes-validations:
    - rule: "!(has(self.mode) && self.mode == 'public' && has(self.anyOf) && size(self.anyOf) > 0)"
      message: access.mode=public cannot be combined with a non-empty access.anyOf
    # novo
    - rule: "!(has(self.mode) && self.mode == 'public') || (!has(self.channel) && !has(self.identityProvider) && !has(self.audience) && !has(self.forwardToken) && !has(self.obo))"
      message: access.mode=public accepts no other access field
    # novo
    - rule: "!(has(self.channel) && self.channel == 'ldap') || (!has(self.identityProvider) && !has(self.audience) && !has(self.forwardToken) && !has(self.obo))"
      message: access.channel=ldap has no token, so it accepts no identityProvider, audience, forwardToken or obo
    # novo
    - rule: "!has(self.obo) || (has(self.forwardToken) && self.forwardToken && has(self.identityProvider) && !has(self.audience))"
      message: access.obo needs forwardToken true and access.identityProvider, and cannot be combined with audience
    # novo
    - rule: "!has(self.audience) || (has(self.forwardToken) && self.forwardToken)"
      message: access.audience needs forwardToken true

# novo, em spec.x-kubernetes-validations (a regra olha o access e o aggregate da rota):
#
#   - rule: "!(has(self.aggregate) && has(self.access) && (has(self.access.audience) || has(self.access.obo)))"
#     message: access.audience and access.obo cannot be combined with aggregate
