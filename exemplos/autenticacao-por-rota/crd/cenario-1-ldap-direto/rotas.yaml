# Cenário 1: o gateway faz o LDAP direto. Store: CRD (v2, snapshot no ConfigMap).
#
# Os GatewayRoute que o time aplica. O operator consolida as rotas num snapshot
# no ConfigMap gateway-routes, que o gateway do application.yaml, ao lado,
# acompanha. São as mesmas rotas de properties/cenario-1-ldap-direto/rotas.yaml.
#
# Nenhum campo da ETT-1452.
# Sem token, forward-token, audience, identity-provider e obo não se aplicam.

# PUBLIC: sem login. O gateway tira os headers X-Auth-Request-* e os cookies dele.
apiVersion: platform.yyy.xxx/v1alpha1
kind: GatewayRoute
metadata:
  name: public-api
  namespace: platform
spec:
  path: /public/**
  targetUri: http://public-api.platform.svc.cluster.local:8080
  stripPrefix: 1
  team: platform-team
  description: Rota pública.
  access:
    mode: public
  rateLimit:                     # 20 a cada 10s por endereço, em cada réplica
    requests: 20
    period: 10s
    key: ip
---
# LDAP direto: login no formulário do gateway e bind no AD. Sem token, só headers.
apiVersion: platform.yyy.xxx/v1alpha1
kind: GatewayRoute
metadata:
  name: abc
  namespace: platform
spec:
  path: /abc/**
  targetUri: http://abc-api.platform.svc.cluster.local:8080
  stripPrefix: 1
  team: abc-team
  description: Membros do grupo abc-users no AD.
  access:
    anyOf:
      - group:abc-users
  rateLimit:                     # 10 a cada 10s por usuário, em cada réplica
    requests: 10
    period: 10s
    key: user
  throttle:                      # até 5 ao mesmo tempo; mais 10 esperam até 2s
    maxConcurrent: 5
    maxQueue: 10
    maxWait: 2s
