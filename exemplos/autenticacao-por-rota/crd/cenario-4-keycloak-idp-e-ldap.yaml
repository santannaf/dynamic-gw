# Cenário 4: o gateway usa o Keycloak com Identity Provider e LDAP. Store: CRD (v2, snapshot no ConfigMap).
#
# Profile do gateway: keycloak. São as mesmas rotas de
# properties/cenario-4-keycloak-idp-e-ldap.yaml, onde estão a explicação do cenário e a
# configuração do gateway.
#
# Novo: identity-provider, audience e obo.
# Com o CRD de hoje, o kubectl recusa os campos novos (unknown field); o schema
# proposto está em schema-access.yaml.

# PUBLIC: sem login. O gateway tira os headers X-Auth-Request-* e os cookies dele.
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: public-api
  namespace: platform
spec:
  path: /public/**
  targetUri: http://public-api.platform.svc.cluster.local:8080
  stripPrefix: 1
  team: platform-team
  description: Rota pública.
  access:
    mode: public
  rateLimit:                     # 20 a cada 10s por endereço, em cada réplica
    requests: 20
    period: 10s
    key: ip
---
# LDAP pelo Keycloak: aceita quem entrou com senha ou pela Microsoft,
# porque é o mesmo usuário do AD.
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: abc
  namespace: platform
spec:
  path: /abc/**
  targetUri: http://abc-api.platform.svc.cluster.local:8080
  stripPrefix: 1
  team: abc-team
  description: Usuários com a role abc-user.
  access:
    anyOf:
      - role:abc-user
    forwardToken: true           # o backend recebe um token
    audience: abc-api            # novo: o da troca V2, com aud=abc-api (client no realm)
  rateLimit:                     # 10 a cada 10s por usuário, em cada réplica
    requests: 10
    period: 10s
    key: user
---
# IDENTITY_PROVIDER: só sessão que veio do login com Microsoft (broker do Keycloak).
# Quem entrou com senha faz login de novo pela Microsoft.
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: business-monitor
  namespace: platform
spec:
  path: /business-monitor/**
  targetUri: http://business-monitor.platform.svc.cluster.local:8080
  stripPrefix: 1
  team: monitor-team
  description: Login com Microsoft e a role business-monitor-user.
  access:
    identityProvider: microsoft  # novo: alias do IdP no realm
    anyOf:
      - role:business-monitor-user
    forwardToken: true           # o backend recebe um token
    audience: business-monitor   # novo: o da troca V2, com aud=business-monitor
  rateLimit:                     # 10 a cada 10s por usuário, em cada réplica
    requests: 10
    period: 10s
    key: user
---
# OBO: troca no Keycloak e OBO no Entra. O Backend B recebe o token E, sem o token A.
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: pedidos
  namespace: platform
spec:
  path: /pedidos/**
  targetUri: http://backend-b.platform.svc.cluster.local:8080
  stripPrefix: 1
  team: pedidos-team
  description: Pedidos do usuário, com o token do Entra.
  access:
    identityProvider: microsoft  # obrigatório no obo: a troca usa o token do login
    anyOf:
      - role:pedidos-leitura
    forwardToken: true           # o backend recebe um token
    obo:                         # novo: o do OBO no Entra
      scopes:
        - api://backend-b/pedidos.read
  rateLimit:                     # 5 a cada 10s por usuário, em cada réplica
    requests: 5
    period: 10s
    key: user
  throttle:                      # até 5 ao mesmo tempo; mais 10 esperam até 2s
    maxConcurrent: 5
    maxQueue: 10
    maxWait: 2s
