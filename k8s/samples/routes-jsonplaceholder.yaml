# Rotas de exemplo contra uma API pública de verdade, o JSONPlaceholder
# (https://jsonplaceholder.typicode.com): posts, comentários e usuários de mentira,
# em JSON. Cada rota mostra uma política de POLITICAS_DE_ROTA.md, e
# scripts/e2e/test-jsonplaceholder.sh (make jsonplaceholder-test) confere todas.
# O cluster precisa de saída para a internet. Os limites contam por réplica.
#
#   /jp/posts/**             proxy simples: a API como ela é (/jp/posts/1 é /posts/1)
#   /jp/limitado/**          rate limit: 3 requisições a cada 10s para cada X-Api-Key
#   /jp/lento/**             throttling: 1 por vez, 1 na fila
#   /jp/artigos/**           fachada em português: path reescrito, campos renomeados,
#                            header da stack escondido e corpo de até 1KB
#   /jp/meus-posts           query fixa (userId=1) e lista só com id e título
#   /jp/post-completo/{id}   agregação: o post e os comentários numa resposta só
#   /jp/post-parcial/{id}    agregação com um backend que falha: resposta parcial
#
# Privadas, com o SSO ligado (make lab). Usuários do diretório do lab: alice
# (tools-httpbin), bob (sem grupo), carol (tools-admins e tools-httpbin). Nenhuma
# usa forwardToken: o token do usuário não sai para uma API de terceiros.
#
#   /jp/privado/**           qualquer usuário logado; 5 requisições a cada 10s para cada usuário
#   /jp/usuarios/**          grupo tools-httpbin; os usuários vêm sem endereço, telefone e empresa
#   /jp/gestao/**            leitura (GET) para tools-httpbin ou tools-admins; escrita só tools-admins
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-posts
  namespace: platform
spec:
  path: /jp/posts/**
  targetUri: https://jsonplaceholder.typicode.com
  stripPrefix: 1
  team: platform-team
  description: JSONPlaceholder as it is - /jp/posts/1 is /posts/1.
  access:
    mode: public
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-limitado
  namespace: platform
spec:
  path: /jp/limitado/**
  targetUri: https://jsonplaceholder.typicode.com
  stripPrefix: 2
  team: platform-team
  description: Three requests every 10 seconds for each X-Api-Key - /jp/limitado/posts/1 is /posts/1.
  access:
    mode: public
  rateLimit:
    requests: 3
    period: 10s
    key: header:X-Api-Key
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-lento
  namespace: platform
spec:
  path: /jp/lento/**
  targetUri: https://jsonplaceholder.typicode.com
  stripPrefix: 2
  team: platform-team
  description: One request at a time, one more waiting for up to 5 seconds - /jp/lento/comments is /comments.
  access:
    mode: public
  throttle:
    maxConcurrent: 1
    maxQueue: 1
    maxWait: 5s
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-artigos
  namespace: platform
spec:
  path: /jp/artigos/**
  targetUri: https://jsonplaceholder.typicode.com
  stripPrefix: 1
  team: platform-team
  description: Facade in Portuguese - /jp/artigos/1 is /posts/1, with the fields renamed.
  access:
    mode: public
  filters:
    - name: RewritePath
      args:
        regexp: /artigos(?<resto>.*)
        replacement: /posts$\{resto}
    - name: RemoveResponseHeader
      args:
        name: X-Powered-By
    - name: AddResponseHeader
      args:
        name: X-Fachada
        value: artigos
    - name: RequestSize
      args:
        maxSize: 1KB
  transform:
    mapping:
      userId: autorId
      title: titulo
      body: conteudo
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-meus-posts
  namespace: platform
spec:
  path: /jp/meus-posts
  targetUri: https://jsonplaceholder.typicode.com
  team: platform-team
  description: The posts of user 1, only id and title - /posts?userId=1.
  access:
    mode: public
  filters:
    - name: SetPath
      args:
        template: /posts
    - name: AddRequestParameter
      args:
        name: userId
        value: "1"
  transform:
    allow: [id, title]
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-post-completo
  namespace: platform
spec:
  path: /jp/post-completo/{id}
  team: platform-team
  description: One answer with the post and its comments.
  access:
    mode: public
  aggregate:
    timeout: 5s
    backends:
      - url: https://jsonplaceholder.typicode.com/posts/{id}
        group: post
        transform:
          allow: [id, title, body]
      - url: https://jsonplaceholder.typicode.com/posts/{id}/comments
        group: comentarios
        transform:
          allow: [name, email]
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-post-parcial
  namespace: platform
spec:
  path: /jp/post-parcial/{id}
  team: platform-team
  description: One of the two backends does not exist - the answer is partial and says so.
  access:
    mode: public
  aggregate:
    timeout: 5s
    backends:
      - url: https://jsonplaceholder.typicode.com/posts/{id}
        group: post
      - url: https://jsonplaceholder.typicode.com/nao-existe/{id}
        group: extra
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-privado
  namespace: platform
spec:
  path: /jp/privado/**
  targetUri: https://jsonplaceholder.typicode.com
  stripPrefix: 2
  team: platform-team
  description: Any authenticated user (no access block), 5 requests every 10 seconds for each user - /jp/privado/posts/1 is /posts/1.
  rateLimit:
    requests: 5
    period: 10s
    key: user
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-usuarios
  namespace: platform
spec:
  path: /jp/usuarios/**
  targetUri: https://jsonplaceholder.typicode.com
  stripPrefix: 1
  team: platform-team
  description: Group tools-httpbin; users come without address, phone and company - /jp/usuarios/1 is /users/1.
  access:
    anyOf:
      - group:tools-httpbin
  filters:
    - name: RewritePath
      args:
        regexp: /usuarios(?<resto>.*)
        replacement: /users$\{resto}
  transform:
    deny: [address, phone, company]
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-gestao-leitura
  namespace: platform
spec:
  path: /jp/gestao/**
  targetUri: https://jsonplaceholder.typicode.com
  stripPrefix: 2
  methods: [GET, HEAD]
  team: platform-team
  description: Reading - groups tools-httpbin or tools-admins - /jp/gestao/posts/1 is /posts/1.
  access:
    anyOf:
      - group:tools-httpbin
      - group:tools-admins
---
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: jp-gestao-escrita
  namespace: platform
spec:
  path: /jp/gestao/**
  targetUri: https://jsonplaceholder.typicode.com
  stripPrefix: 2
  methods: [POST, PUT, PATCH, DELETE]
  team: platform-team
  description: Writing - group tools-admins only; the API pretends to save.
  access:
    anyOf:
      - group:tools-admins
  filters:
    - name: RequestSize
      args:
        maxSize: 1KB
