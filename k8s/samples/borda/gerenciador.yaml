# Modelo de rota do gateway do gerenciador (sessão do SACA, permissões do SACA), com nomes e hosts fictícios. Serve de formato para
# o levantamento: os times trocam estes exemplos por rotas reais e o CRD é validado com
#   kubectl apply --dry-run=server -f k8s/samples/borda/
apiVersion: platform.saca.pags/v1alpha1
kind: GatewayRoute
metadata:
  name: borda-gerenciador-relatorios
  namespace: platform
spec:
  path: /gerenciador/relatorios/**
  targetUri: http://relatorios-bff.gerenciador.svc.cluster.local:8080
  methods: [GET]
  team: gerenciador
  description: Relatórios gerenciais.
  access:
    anyOf:
      - saca:relatorio-gerencial
