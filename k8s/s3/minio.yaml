# MinIO (S3 compatível) para testar o store S3 no k3d sem conta AWS.
# Só para o lab. Aplicado por scripts/deploy-sso.sh (MODE=s3, S3_BACKEND=minio),
# que troca __S3_BUCKET__ e gera o Secret minio-credentials (fora do git).
# O bucket é criado no startup (MINIO_DEFAULT_BUCKETS). O PVC (local-path do
# k3s) segura o snapshot se o pod reiniciar: sem ele o gateway leria "objeto
# não existe" e ficaria sem rotas até o próximo publish do operator.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: platform
  labels:
    app.kubernetes.io/name: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: platform
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: dynamic-gateway-control-plane
    spec:
      containers:
        - name: minio
          image: bitnamilegacy/minio:2025.5.24
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio-credentials, key: AWS_ACCESS_KEY_ID}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio-credentials, key: AWS_SECRET_ACCESS_KEY}
            - name: MINIO_DEFAULT_BUCKETS
              value: __S3_BUCKET__
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: platform
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
