# ==================================================================
# CABEÇALHO (FIXO pelo Kubernetes)
# ==================================================================
apiVersion: apiextensions.k8s.io/v1   # FIXO - toda CRD usa essa API
kind: CustomResourceDefinition        # FIXO - você está criando uma CRD
metadata:
  # CONVENÇÃO obrigatória: formato <plural>.<group>
  # tem que casar com spec.names.plural + "." + spec.group, senão o apply rejeita
  name: gatewayroutes.platform.saca.pags

# ==================================================================
# IDENTIDADE DA CRD
# ==================================================================
spec:
  group: platform.saca.pags    # SEU - domínio reverso (ex.: "saca.pags")
  scope: Namespaced            # ESCOLHA - "Namespaced" (por namespace) ou "Cluster" (global)
  names:
    kind: GatewayRoute         # SEU - PascalCase, é o "kind:" que o usuário escreve no YAML
    listKind: GatewayRouteList # CONVENÇÃO - sempre kind + "List"
    plural: gatewayroutes      # SEU - lowercase, vira parte da URL REST
    singular: gatewayroute     # SEU - lowercase
    shortNames:                # SEU/OPCIONAL - atalho do kubectl (kubectl get gwr)
      - gwr

  # ==================================================================
  # VERSIONAMENTO DA API
  # ==================================================================
  versions:
    - name: v1alpha1     # SEU - convenção K8s: v1alpha1 → v1beta1 → v1
      served: true       # FIXO opções (true/false) - se a API responde nessa versão
      storage: true      # FIXO opções (true/false) - EXATAMENTE UMA versão pode ser storage:true

      # ==================================================================
      # SCHEMA - daqui para baixo é 100% SEU (contrato do seu recurso)
      # ==================================================================
      schema:
        openAPIV3Schema:    # FIXO - chave do K8s
          type: object      # FIXO - todo recurso é object
          properties:
            spec:           # CONVENÇÃO - "spec" (desejado) e opcionalmente "status" (observado)
              type: object
              required:     # SEU - campos obrigatórios do spec
                - path
              # SEU - regra entre campos (CEL): a rota encaminha para um destino ou agrega vários.
              x-kubernetes-validations:
                - rule: "has(self.targetUri) != has(self.aggregate)"
                  message: declare either targetUri or aggregate, not both
                - rule: "!has(self.aggregate) || !has(self.methods) || self.methods.all(m, m == 'GET')"
                  message: aggregate only answers GET; methods must be [GET] or absent
              properties:   # SEU - modelo de domínio
                # --- path: predicado de rota ---
                path:
                  type: string          # FIXO opções: string/integer/boolean/array/object/number
                  minLength: 1          # SEU - validação
                  description: Ant-style HTTP path predicate (e.g. /httpbin/**).
                # --- targetUri: para onde redireciona ---
                targetUri:
                  type: string
                  minLength: 1
                  description: Absolute URI the route forwards to.
                # --- stripPrefix: quantos segmentos remover antes de encaminhar ---
                stripPrefix:
                  type: integer
                  minimum: 0            # SEU - não aceita negativo
                  default: 1            # SEU - se omitido, K8s aplica 1 automaticamente
                  description: Number of path segments stripped before forwarding.
                # --- methods: HTTP verbs aceitos (vazio = todos) ---
                methods:
                  type: array
                  description: Uppercase HTTP methods this route matches. Empty/absent means any method.
                  items:
                    type: string
                    enum:                # SEU - restringe valores aceitos (rejeita "FOO")
                      - GET
                      - POST
                      - PUT
                      - PATCH
                      - DELETE
                      - HEAD
                      - OPTIONS
                # --- enabled: liga/desliga a rota sem deletar o CR ---
                enabled:
                  type: boolean
                  default: true        # SEU - default true (se omitido)
                  description: When false, the operator omits this route from the published snapshot.
                # --- team: dono da rota (metadata; não afeta roteamento) ---
                team:
                  type: string
                  maxLength: 64        # SEU - cap defensivo, evita string gigante via apply
                  description: Owning team for this route (free-text identifier). Surfaced by /internal/routes; ignored by the matcher.
                # --- description: breve resumo do que a rota faz ---
                description:
                  type: string
                  maxLength: 512       # SEU - cap defensivo
                  description: Short human-readable description of what this route does. Surfaced by /internal/routes; ignored by the matcher.
                # --- access: quem pode usar a rota (aplicado pelo gateway com gateway.security.enabled=true) ---
                access:
                  type: object
                  description: Access policy enforced by the gateway. Absent means the gateway's default access (gateway.security.default-access).
                  properties:
                    mode:
                      type: string
                      enum:            # SEU - public = sem login; authenticated = exige identidade
                        - public
                        - authenticated
                      description: public allows anonymous callers; authenticated requires a session or a bearer token. Absent with anyOf means authenticated.
                    anyOf:
                      type: array
                      maxItems: 32     # SEU - cap defensivo
                      description: The caller needs at least one of these authorities, written <type>:<name>. Each gateway defines its types (group:<name>, role:<name>, scope:<name>, ...); a type the gateway does not produce authorizes nobody.
                      items:
                        type: string
                        maxLength: 256
                        pattern: '^[a-z][a-z0-9-]*:.+$'   # SEU - tipo aberto: cada gateway de borda define os seus
                    forwardToken:
                      type: boolean
                      description: When true the gateway forwards the caller's access token upstream as Authorization Bearer.
                  # SEU - regra entre campos (CEL): rota pública não pode exigir autoridade.
                  x-kubernetes-validations:
                    - rule: "!(has(self.mode) && self.mode == 'public' && has(self.anyOf) && size(self.anyOf) > 0)"
                      message: access.mode=public cannot be combined with a non-empty access.anyOf
                # --- rateLimit: requisições por período, contadas em cada réplica do gateway (429 acima) ---
                rateLimit:
                  type: object
                  description: Requests per period on this route, counted by each gateway replica. Above it the gateway answers 429. The global ceiling in gateway.traffic.rate-limit also applies.
                  required: [requests, period]
                  properties:
                    requests:
                      type: integer
                      minimum: 1
                      description: Requests allowed per period.
                    period:
                      type: string
                      pattern: '^[0-9]{1,9}(ms|s|m|h)$'
                      description: Length of the period, such as 1s, 1m or 500ms.
                    burst:
                      type: integer
                      minimum: 1
                      description: Requests that may arrive at once. Absent means requests.
                    key:
                      type: string
                      pattern: '^(route|ip|user|client-id|header:[A-Za-z0-9-]+)$'
                      description: Whose budget a request spends. route (default) counts every caller together; ip, user, client-id or header:<name> give each caller its own budget.
                # --- throttle: requisições simultâneas, com fila (503 acima) ---
                throttle:
                  type: object
                  description: Concurrency cap of this route, in each gateway replica. Requests beyond maxConcurrent wait in a queue for up to maxWait; a full queue or a timeout answers 503.
                  required: [maxConcurrent]
                  properties:
                    maxConcurrent:
                      type: integer
                      minimum: 1
                      description: Requests that may run at the same time.
                    maxQueue:
                      type: integer
                      minimum: 0
                      description: Requests that may wait for a slot. Absent means 0 (no queue).
                    maxWait:
                      type: string
                      pattern: '^[0-9]{1,9}(ms|s|m|h)$'
                      description: Longest wait in the queue, such as 200ms. Absent means no wait.
                # --- filters: filtros do catálogo, aplicados na ordem ---
                filters:
                  type: array
                  maxItems: 16         # SEU - cap defensivo
                  description: Filters applied in order, after stripPrefix. Only catalog filters are accepted, and none may touch the identity headers (X-Auth-Request-*).
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        enum:
                          - AddRequestHeader
                          - SetRequestHeader
                          - RemoveRequestHeader
                          - AddResponseHeader
                          - SetResponseHeader
                          - RemoveResponseHeader
                          - RewritePath
                          - PrefixPath
                          - SetPath
                          - AddRequestParameter
                          - RemoveRequestParameter
                          - RequestSize
                      args:
                        type: object
                        description: Named arguments of the filter, such as name and value for AddRequestHeader.
                        additionalProperties:
                          type: string
                # --- transform: mudanças na resposta JSON (como no KrakenD) ---
                transform:
                  type: object
                  description: Changes to the JSON response, in this order - target, allow or deny, mapping, group.
                  properties:
                    allow:
                      type: array
                      description: Keep only these fields.
                      items: {type: string, minLength: 1}
                    deny:
                      type: array
                      description: Drop these fields.
                      items: {type: string, minLength: 1}
                    mapping:
                      type: object
                      description: Rename fields (old name to new name).
                      additionalProperties: {type: string, minLength: 1}
                    target:
                      type: string
                      minLength: 1
                      description: Keep only the object under this field.
                    group:
                      type: string
                      minLength: 1
                      description: Wrap the result under this field.
                  x-kubernetes-validations:
                    - rule: "!(has(self.allow) && size(self.allow) > 0 && has(self.deny) && size(self.deny) > 0)"
                      message: transform takes allow or deny, not both
                # --- aggregate: chama vários backends e devolve uma resposta só (no lugar de targetUri) ---
                aggregate:
                  type: object
                  description: Calls every backend in parallel (GET only) and answers with one JSON object. Replaces targetUri.
                  required: [backends]
                  properties:
                    timeout:
                      type: string
                      pattern: '^[0-9]{1,9}(ms|s|m|h)$'
                      description: Time limit for all the calls. Absent means gateway.traffic.aggregate.timeout.
                    backends:
                      type: array
                      minItems: 2
                      maxItems: 10
                      items:
                        type: object
                        required: [url]
                        properties:
                          url:
                            type: string
                            pattern: '^https?://'
                            description: Absolute URL; may use the route's path variables, such as http://pedidos/pedidos/{id}.
                          group:
                            type: string
                            minLength: 1
                            description: Put this backend's response under this field. Absent merges its fields into the response.
                          transform:
                            type: object
                            description: Changes to this backend's response, before the merge (same fields as spec.transform).
                            properties:
                              allow:
                                type: array
                                items: {type: string, minLength: 1}
                              deny:
                                type: array
                                items: {type: string, minLength: 1}
                              mapping:
                                type: object
                                additionalProperties: {type: string, minLength: 1}
                              target:
                                type: string
                                minLength: 1
                              group:
                                type: string
                                minLength: 1

      # ==================================================================
      # COLUNAS do `kubectl get` - puramente cosmético, SEU
      # Define o que aparece em: kubectl get gatewayroutes
      # ==================================================================
      additionalPrinterColumns:
        - name: Path                              # SEU - cabeçalho da coluna
          type: string                            # FIXO opções: string/integer/boolean/date/number
          jsonPath: .spec.path                    # SEU - campo a extrair do objeto
        - name: Target
          type: string
          jsonPath: .spec.targetUri
        - name: Team                              # SEU - facilita `kubectl get gwr` filtrado por dono
          type: string
          jsonPath: .spec.team
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Access                            # vazio = default do gateway (ou só anyOf, ver -o wide)
          type: string
          jsonPath: .spec.access.mode
        - name: AnyOf
          type: string
          jsonPath: .spec.access.anyOf
          priority: 1                             # só aparece com `kubectl get gwr -o wide`
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
