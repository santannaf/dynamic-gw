# Keycloak do lab para o provedor `keycloak` do gateway: modo produção (`start`)
# sobre PostgreSQL (k8s/sso/keycloak-postgres.yaml) ou Oracle
# (k8s/sso/keycloak-oracle.yaml, com KEYCLOAK_DB=oracle). Aplicado por
# scripts/keycloak/keycloak.sh, que troca __HOST_PORT__ e __KEYCLOAK_IMAGE__ e
# cria o ConfigMap do realm. A conexão com o banco vem do ConfigMap e do Secret
# `keycloak-db`, que o script do banco (scripts/db/) publica.
#
# Usuários e grupos vêm do diretório (User federation, somente leitura, por
# LDAPS): OpenLDAP do lab ou o AD da POC. No realm só ficam a conta de serviço
# e as roles do client tools-gateway.
#
# Ainda é lab: http em localhost e uma réplica. Em produção, TLS de verdade no
# hostname e duas ou mais réplicas sobre o mesmo banco.
#
# Um único issuer público para browser e pods: KC_HOSTNAME fixa o `iss`
# (http://localhost:<porta>/auth/realms/tools) e BACKCHANNEL_DYNAMIC deixa
# o gateway falar com o Service interno sem mudar o `iss` dos tokens.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: dynamic-gateway-control-plane
      annotations:
        # O realm só é importado quando não existe no banco. Quando o JSON ou o
        # diretório mudam, scripts/keycloak/keycloak.sh zera o banco e este
        # checksum recria o pod, que importa o realm de novo.
        platform.saca.pags/realm-checksum: "__REALM_CHECKSUM__"
        # O tema da tela de login: muda sem zerar o banco, só recria o pod.
        platform.saca.pags/theme-checksum: "__THEME_CHECKSUM__"
    spec:
      containers:
        - name: keycloak
          # quay.io/keycloak/keycloak:26.1, ou keycloak-oracle:local (com o driver da Oracle).
          image: __KEYCLOAK_IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HOSTNAME
              value: http://localhost:__HOST_PORT__/auth
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # http só no lab (localhost); em produção, TLS no Keycloak ou no ingress.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Eventos de login/logout/refresh no stdout em INFO: é a outra
            # metade da trilha de auditoria (o gateway loga o `sid`).
            - name: KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL
              value: info
            # O admin só é criado quando o banco ainda não tem nenhum.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: keycloak-admin-password}
            # Placeholders ${...} do realm-tools.json
            - name: GATEWAY_PUBLIC_BASE_URL
              value: http://localhost:__HOST_PORT__
            - name: TOOLS_GATEWAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: tools-gateway-client-secret}
            - name: TOOLS_CLI_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: tools-cli-client-secret}
            # Federação do diretório (placeholders ${LDAP_*} do realm): os valores vêm
            # do ConfigMap e do Secret `keycloak-ldap`, que o scripts/keycloak/keycloak.sh
            # monta para o OpenLDAP do lab (DIRECTORY=openldap) ou para o AD da POC (DIRECTORY=ad).
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-ldap, key: bind-password}
            # Botão "Login com Microsoft" (placeholders ${MICROSOFT_*} do realm): URLs e client ID
            # no ConfigMap keycloak-microsoft, segredo no Secret; MICROSOFT=sim ou entra no keycloak.sh.
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: keycloak-microsoft, key: client-secret}
            # Senha dos usuários do realm microsoft-sim: a mesma do diretório do lab.
            - name: MICROSOFT_SIM_PASSWORD
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: demo-password}
            # CA que assina o certificado do diretório (LDAPS). Sem ela, PKIX path building failed.
            - name: KC_TRUSTSTORE_PATHS
              value: /opt/keycloak/conf/truststores/ldap-ca.pem
          envFrom:
            - configMapRef:
                name: keycloak-ldap
            - configMapRef:
                name: keycloak-microsoft
            # KC_DB e KC_DB_URL; KC_DB_USERNAME e KC_DB_PASSWORD no Secret.
            - configMapRef:
                name: keycloak-db
            - secretRef:
                name: keycloak-db
          readinessProbe:
            httpGet:
              path: /auth/realms/tools/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 60
          # Sem imagem otimizada, o `start` faz o build do Quarkus no boot: abaixo de ~2 GiB o pod morre por OOM.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: ldap-ca
              mountPath: /opt/keycloak/conf/truststores/ldap-ca.pem
              subPath: ca.pem
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/tools
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-tools
        - name: theme
          configMap:
            name: keycloak-theme-tools
            items:
              - {key: theme.properties, path: login/theme.properties}
              - {key: login.ftl, path: login/login.ftl}
              - {key: tools.css, path: login/resources/css/tools.css}
              - {key: logo.svg, path: login/resources/img/logo.svg}
              - {key: favicon.ico, path: login/resources/img/favicon.ico}
              - {key: microsoft.svg, path: login/resources/img/microsoft.svg}
              - {key: messages_pt_BR.properties, path: login/messages/messages_pt_BR.properties}
        - name: ldap-ca
          secret:
            secretName: keycloak-ldap
            items:
              - key: ca.pem
                path: ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# /auth vai direto pro Keycloak; o resto continua no nginx-lb (k8s/gateway/ingress.yaml).
# Consequência: nenhuma GatewayRoute pode usar o prefixo /auth neste ambiente.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
