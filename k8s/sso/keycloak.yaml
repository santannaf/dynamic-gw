# Keycloak local (modo dev, H2 em disco efêmero) para o provedor `keycloak`
# do gateway. Aplicado por scripts/deploy-sso.sh, que troca __HOST_PORT__
# pela porta do k3d e cria o ConfigMap do realm e o Secret `sso-secrets`.
#
# Usuários e grupos vêm do diretório (User federation, somente leitura, por
# LDAPS): OpenLDAP do lab ou o AD da POC. No realm só ficam a conta de serviço
# e as roles do client tools-gateway.
#
# Um único issuer público para browser e pods: KC_HOSTNAME fixa o `iss`
# (http://localhost:<porta>/auth/realms/tools) e BACKCHANNEL_DYNAMIC deixa
# o gateway falar com o Service interno sem mudar o `iss` dos tokens.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: dynamic-gateway-control-plane
      annotations:
        # O modo dev só importa o realm no boot e perde as sessões ao reiniciar:
        # o pod só é recriado quando o realm-tools.json muda.
        platform.saca.pags/realm-checksum: "__REALM_CHECKSUM__"
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HOSTNAME
              value: http://localhost:__HOST_PORT__/auth
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Eventos de login/logout/refresh no stdout em INFO: é a outra
            # metade da trilha de auditoria (o gateway loga o `sid`).
            - name: KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL
              value: info
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: keycloak-admin-password}
            # Placeholders ${...} do realm-tools.json
            - name: GATEWAY_PUBLIC_BASE_URL
              value: http://localhost:__HOST_PORT__
            - name: TOOLS_GATEWAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: tools-gateway-client-secret}
            - name: TOOLS_CLI_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: tools-cli-client-secret}
            # Federação do diretório (placeholders ${LDAP_*} do realm): os valores vêm
            # do ConfigMap e do Secret `keycloak-ldap`, que o deploy-sso.sh monta para o
            # OpenLDAP do lab (DIRECTORY=openldap) ou para o AD da POC (DIRECTORY=ad).
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-ldap, key: bind-password}
            # CA que assina o certificado do diretório (LDAPS). Sem ela, PKIX path building failed.
            - name: KC_TRUSTSTORE_PATHS
              value: /opt/keycloak/conf/truststores/ldap-ca.pem
          envFrom:
            - configMapRef:
                name: keycloak-ldap
          readinessProbe:
            httpGet:
              path: /auth/realms/tools/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 60
          # start-dev reaugmenta o Quarkus no boot: abaixo de ~2 GiB o pod morre por OOM.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: ldap-ca
              mountPath: /opt/keycloak/conf/truststores/ldap-ca.pem
              subPath: ca.pem
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-tools
        - name: ldap-ca
          secret:
            secretName: keycloak-ldap
            items:
              - key: ca.pem
                path: ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# /auth vai direto pro Keycloak; o resto continua no nginx-lb (k8s/gateway/ingress.yaml).
# Consequência: nenhuma GatewayRoute pode usar o prefixo /auth neste ambiente.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
