# Operator do cenário S3 (publica o snapshot no objeto S3 em vez da ConfigMap).
# Mesmo conteúdo de k8s/s3/operator-deployment.yaml, com os __PLACEHOLDERS__
# que o scripts/deploy-sso.sh (MODE=s3) troca, inclusive endpoint/path-style
# para o MinIO local. O operator não tem SSO: só o gateway muda de profile.
# Doc: SSO_CENARIO_S3.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-route-operator
  namespace: platform
  labels:
    app.kubernetes.io/name: gateway-route-operator
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-route-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-route-operator
        app.kubernetes.io/part-of: dynamic-gateway-control-plane
    spec:
      serviceAccountName: gateway-route-operator
      containers:
        - name: operator
          image: dynamic-gateway-operator:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: __S3_CREDENTIALS_SECRET__
          env:
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE
              value: none
            - name: OPERATOR_NAMESPACE
              value: platform
            - name: OPERATOR_GATEWAY_RELOAD_URL
              value: http://dynamic-gateway.platform.svc.cluster.local:8080/internal/routes/reload
            - name: OPERATOR_ROUTES_STORE_TYPE
              value: s3
            # Store S3: a mesma key que o gateway lê.
            - name: OPERATOR_ROUTES_STORE_S3_KEY
              value: snapshots/routes.yaml
            - name: OPERATOR_ROUTES_STORE_S3_BUCKET
              value: __S3_BUCKET__
            - name: OPERATOR_ROUTES_STORE_S3_REGION
              value: __S3_REGION__
            # AWS: endpoint vazio e path-style false. MinIO local: Service do MinIO + path-style.
            - name: OPERATOR_ROUTES_STORE_S3_ENDPOINT
              value: "__S3_ENDPOINT__"
            - name: OPERATOR_ROUTES_STORE_S3_PATH_STYLE_ACCESS
              value: "__S3_PATH_STYLE__"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
