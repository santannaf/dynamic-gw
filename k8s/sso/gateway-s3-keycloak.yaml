# Cenário S3 (v2: GatewayRoute -> operator -> objeto S3) com SSO pelo Keycloak (OIDC).
# Substitui k8s/gateway/deployment.yaml (mesmas réplicas e limites; só o store
# muda). Aplicado por scripts/deploy-sso.sh (MODE=s3 PROVIDER=keycloak), que
# troca os placeholders: porta, bucket, região, endpoint e o Secret com
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY. Doc: SSO_CENARIO_S3.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-gateway
  namespace: platform
  labels:
    app.kubernetes.io/name: dynamic-gateway
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  # Duas réplicas por default para validar a propagação multi-instância:
  # cada pod tem seu próprio RouteConfigChangeListener e converge sozinho
  # quando o ConfigMap muda - sem depender de um sinal HTTP que só
  # atingiria uma das réplicas.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamic-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamic-gateway
        app.kubernetes.io/part-of: dynamic-gateway-control-plane
    spec:
      serviceAccountName: dynamic-gateway
      containers:
        - name: gateway
          image: dynamic-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: __S3_CREDENTIALS_SECRET__
          env:
            # Faz o JVM (e timestamps de logback) usarem America/Sao_Paulo.
            # debian:stable-slim já traz /usr/share/zoneinfo, então basta a env.
            - name: TZ
              value: America/Sao_Paulo
            # Store S3: key e poll-interval vêm do profile s3 (application-s3.yaml).
            - name: GATEWAY_ROUTES_STORE_S3_BUCKET
              value: __S3_BUCKET__
            - name: GATEWAY_ROUTES_STORE_S3_REGION
              value: __S3_REGION__
            # AWS: endpoint vazio e path-style false. MinIO local: Service do MinIO + path-style.
            - name: GATEWAY_ROUTES_STORE_S3_ENDPOINT
              value: "__S3_ENDPOINT__"
            - name: GATEWAY_ROUTES_STORE_S3_PATH_STYLE_ACCESS
              value: "__S3_PATH_STYLE__"
            # --- SSO + auditoria: o resto vem dos profiles (gateway/src/main/resources/application-keycloak.yaml) ---
            - name: SPRING_PROFILES_ACTIVE
              value: s3,keycloak
            - name: GATEWAY_SECURITY_PUBLIC_BASE_URL
              value: http://localhost:__HOST_PORT__
            - name: GATEWAY_SECURITY_SESSION_COOKIE_SECURE
              value: "false"                # http local; em produção, remova (o profile usa true)
            - name: GATEWAY_SECURITY_SESSION_KEYS_0_ID
              value: k1
            - name: GATEWAY_SECURITY_SESSION_KEYS_0_SECRET
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: session-key}
            - name: GATEWAY_SECURITY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: tools-gateway-client-secret}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              # 4 cores liberados pra que o ForkJoinPool.commonPool() do
              # parallelStream no FastRouteCompiler tenha paralelismo > 1
              # (parallelism = max(1, availableProcessors() - 1)).
              # Como reload é evento ocasional, o pico de CPU é curto;
              # o request path normal usa muito menos.
              cpu: 8000m
              memory: 768Mi