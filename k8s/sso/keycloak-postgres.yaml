# Banco do Keycloak no lab: PostgreSQL (o default; a alternativa é
# keycloak-oracle.yaml). Guarda o que o Keycloak não lê do diretório: realm,
# clients, roles, a cópia dos usuários importados do AD, as sessões e os eventos.
# Aplicado por scripts/db/postgres.sh, que gera o Secret keycloak-postgres uma vez.
#
# StatefulSet com volume (local-path no k3d): reiniciar o Keycloak ou o banco não
# perde sessões nem configuração. Em produção, use um PostgreSQL gerenciado ou um
# operador (CloudNativePG), com backup.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  serviceName: keycloak-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgres
        app.kubernetes.io/part-of: dynamic-gateway-control-plane
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: TZ
              value: America/Sao_Paulo
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: keycloak-postgres, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-postgres, key: password}
            # Subdiretório: a raiz do volume pode ter lost+found, e o initdb recusa diretório não vazio.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d keycloak"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: keycloak-postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: platform
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
spec:
  selector:
    app.kubernetes.io/name: keycloak-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
