# Cenário Properties (v1 standalone: rotas em properties, sem operator/CRD)
# com login direto no diretório (OpenLDAP local no lugar do AD). Substitui k8s/gateway-standalone/deployment.yaml.
# Aplicado por scripts/deploy-sso.sh (MODE=standalone PROVIDER=ldap),
# que troca __HOST_PORT__. Rotas e `access`: application-standalone-sso.yaml.
# Doc: SSO_CENARIO_PROPERTIES.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-gateway
  namespace: platform
  labels:
    app.kubernetes.io/name: dynamic-gateway
    app.kubernetes.io/part-of: dynamic-gateway-control-plane
    app.kubernetes.io/component: standalone
spec:
  # Duas réplicas: mesmo no modo standalone vale balancear carga + tolerar
  # rolling restart sem janela de unavailability (maxUnavailable: 0).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamic-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamic-gateway
        app.kubernetes.io/part-of: dynamic-gateway-control-plane
        app.kubernetes.io/component: standalone
    spec:
      # SEM serviceAccountName customizado: modo standalone não precisa de
      # RBAC para ler ConfigMap remoto (não tem operator). O ServiceAccount
      # default do namespace basta.
      containers:
        - name: gateway
          image: dynamic-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Sao_Paulo
            # --- SSO + auditoria: o resto vem dos profiles (gateway/src/main/resources/application-ldap.yaml) ---
            - name: SPRING_PROFILES_ACTIVE
              value: standalone-sso,ldap
            - name: GATEWAY_SECURITY_PUBLIC_BASE_URL
              value: http://localhost:__HOST_PORT__
            - name: GATEWAY_SECURITY_SESSION_COOKIE_SECURE
              value: "false"                # http local; em produção, remova (o profile usa true)
            - name: GATEWAY_SECURITY_SESSION_KEYS_0_ID
              value: k1
            - name: GATEWAY_SECURITY_SESSION_KEYS_0_SECRET
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: session-key}
            - name: GATEWAY_SECURITY_LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef: {name: sso-secrets, key: ldap-readonly-password}
            # Local: 30s para ver a revalidação no e2e; o profile usa 5m.
            - name: GATEWAY_SECURITY_LDAP_REVALIDATE_AFTER
              value: 30s
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Modo standalone com catálogos pequenos (até alguns milhares
              # de rotas) cabe folgado em 512 MiB. Se for crescer para 30k+,
              # reabrir a issue de compactação (openspec/changes/reduce-gateway-route-memory).
              cpu: 8000m
              memory: 512Mi
